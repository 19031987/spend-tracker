name: Build SpendTracker Android APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Accept Android SDK Licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Build Signed APK & Play Store App Bundle (AAB)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace 2>&1 | tee build.log
        mkdir -p dist
        find . -name "*.apk" -exec cp -v {} dist/ \; || true
        find . -name "*.aab" -exec cp -v {} dist/ \; || true
        echo "### Build Log Summary" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 30 build.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "### Dist Directory Contents" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        ls -la dist/ >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload Signed Release Files (APK and AAB)
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-Release-Files
        path: dist/
        if-no-files-found: warn

    - name: Publish GitHub Release with APK & AAB
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: "SpendTracker Production Release v1.0.0"
        body: |
          ### SpendTracker v1.0.0 - Google Play Release
          - **Google Play App Bundle (`.aab`)**: `app-release.aab` (Upload this file to Google Play Console)
          - **Signed Direct APK (`.apk`)**: `app-release.apk` (Install directly on any Android device)
          - **Keystore**: Signed with production release keystore
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
