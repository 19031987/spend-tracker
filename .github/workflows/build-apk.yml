name: Build SpendTracker Android APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Accept Android SDK Licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Build Signed APK & Play Store App Bundle (AAB)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        if ! gradle :app:assembleRelease :app:bundleRelease -x test --no-daemon --stacktrace > build.log 2>&1; then
          echo "=== GRADLE BUILD FAILED ==="
          grep -E "(e: |error:|FAILURE:|BUILD FAILED|Caused by:)" build.log | head -n 30 | while read -r line; do
            echo "::error::$line"
          done
          tail -n 15 build.log | while read -r line; do
            echo "::error::TAIL: $line"
          done
          exit 1
        fi
        mkdir -p dist
        find app/build/outputs/ -name "*.apk" -exec cp -v {} dist/ \;
        find app/build/outputs/ -name "*.aab" -exec cp -v {} dist/ \;
        ls -la dist/

    - name: Upload Signed Release Files (APK and AAB)
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-Release-Files
        path: dist/
        if-no-files-found: error

    - name: Publish GitHub Release with APK & AAB
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.8.2
        name: "SpendTracker Release v1.8.2 (Bank Source Cleanup & Auto-Discovery)"
        body: |
          ### SpendTracker v1.8.2 - Bank Source Cleanup & Auto-Discovery
          - 🏦 **Bank Source Cleanup & Auto-Discovery**:
            - Eliminated unnecessary "Messages" and "Savings" source accounts.
            - Real-time auto-discovery: genuine bank sources (Barclays, Monzo, Starling, Revolut, Lloyds, etc.) are automatically added when new transactions arrive.
            - SMS notification parser attributes card spend to genuine bank accounts rather than messaging app packages.
            - Database migration automatically re-links orphan/junk accounts to canonical bank accounts.
          - 📅 **Custom Date Picker in Record Transaction**:
            - Added calendar date picker dialog (`Pick Date`) alongside Today, Yesterday, and 2 Days Ago.
            - Easily add Money In / Out or Transfers on any given past or future date.
          - 📐 **Landing Page Net Spending Hero Card Alignment**:
            - Refactored Spent, Income, and Transfers indicators to prevent awkward multi-line word wrapping and vertical squishing on narrow devices.
          - 📊 **Category-Level Period Comparison in Compare Tab**:
            - Compares actual spending across individual categories between current and previous periods.
          - 📊 **Category-Level Period Comparison in Compare Tab**:
            - Compares actual spending across individual categories (Groceries, Dining Out, Utilities, Transport, etc.) between the current period and previous period (Week, Month, Year).
            - Real-time reactive data pipeline powered by Room database transactions and category catalogue.
            - Visual progress indicator bars showing proportional category spend with percentage and delta badges.
            - Interactive Mode Selector: Switch effortlessly between **By Category** (Category Comparison) and **By Time** (Interval Breakdown).
          - 🌊 **Monarch-Style Cash Flow Sankey & Breakdown Treemap**:
            - 4-column node alignment (`Account` ➔ `Group` ➔ `Category` ➔ `Merchant`).
            - Interactive depth toggle and dynamic fixed living costs exclusion toggle.
          - 🗺️ **Hierarchical Spending Breakdown Treemap**:
            - Proportional spending nested by `Group` ➔ `Category` ➔ `Merchant` with zoomable drill-down.
          - ⚖️ **Dynamic Fixed Living Costs Exclusion Toggle**:
            - Prominent toggle to exclude Rent & Utilities, dynamically rescaling nodes, link flows, and proportions between all-in spend (£1,540.77) and day-to-day spend (£242.98).
          - 📊 **Reactive KPI Ribbon**:
            - Real-time updates for Total Spend, Transaction Count, Top Spending Group, and Top Merchant with visit counts.
          - 📱 **All-in-One Dashboard & Simulator Integration**:
            - Direct simulator access and standalone cash flow breakdown page.
          - 🔒 **Fingerprint & Biometric Authentication Access** (v1.6.0 features included).
          - 🍕 **Promotional & Advertisement Notification Filtering**:
            - Protection against promotional deals, retail offers, and marketing notifications (e.g. Domino's "Save £10 when you spend £30", pizza deals, voucher codes, discounts).
            - Enforced strict financial transaction verification for SMS alerts (`debited`, `spent`, `paid at`, `card ending`, etc.).
          - 🏦 **Eliminated Legacy "Checking" Account**:
            - Legacy seeded "Checking" / "current account" sources are cleanly remapped and consolidated into the canonical Chase bank account.
            - Added Room Migration 6 -> 7 and automated database startup cleanup that safely migrates any existing transactions referencing "Checking" to Chase, and permanently purges "Checking" from accounts, pickers, and filter chips.
          - ⏰ **UI Time & Timestamp Alignment**:
            - Aligned transaction timestamp (`HH:mm`) in the dedicated right-hand column directly beneath the amount.
            - Enhanced metadata badges with adaptive wrapping (`FlowRow`).
          - ⏱️ **Notification Deduplication & Directional Parsing**:
            - Time-window fingerprinting (±60s) and smart incoming/outgoing parsing.
            - Implemented automated database migration and `onOpen` consolidation that safely remaps existing transactions referencing duplicate account rows to the canonical account ID before removing duplicates.
            - Normalized bank names across notifications and UI (handling case differences, aliases like "Chase UK", "Barclaycard", and trailing terms like "Bank" / "Account").
            - Deduplicated account lists across filter chips, transaction editors, and transfer pickers.
          - ⏱️ **Time-Window Fingerprinting (Deduplication)**:
            - Deduplication window (±60s) matching amount and bank source with in-place record enrichment.
          - ↕️ **Strict Directional Parsing**:
            - Semantic Money In / Money Out classification with internal transfer nullification between own accounts.
          - 📊 **Baseline Guard for First Load Comparisons**:
            - Replaces premature delta percentages with onboarding guidance until baseline data is collected.
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
