name: Build SpendTracker Android APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Accept Android SDK Licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Build Signed APK & Play Store App Bundle (AAB)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        set -o pipefail
        gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
        mkdir -p dist
        find app/build/outputs/ -name "*.apk" -exec cp -v {} dist/ \;
        find app/build/outputs/ -name "*.aab" -exec cp -v {} dist/ \;
        ls -la dist/

    - name: Upload Signed Release Files (APK and AAB)
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-Release-Files
        path: dist/
        if-no-files-found: error

    - name: Publish GitHub Release with APK & AAB
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.3.0
        name: "SpendTracker Release v1.3.0 (Nullified Internal Transfers, Chase & HSBC Account Sources, & Edit Support)"
        body: |
          ### SpendTracker v1.3.0 - Nullified Internal Transfers & Account Sources
          - 🔄 **Nullified Internal Transactions**: Transfers between accounts (Chase ➔ HSBC) are strictly excluded from spending totals, cash flow calculations, and period analytics.
          - 🏛️ **Explicit Chase & HSBC Sources**: Added first-class Chase and HSBC accounts, source badges on all transactions, and dedicated Chase & HSBC breakdown cards (eliminating generic "others").
          - ✏️ **Edit From / To Accounts**: Full Material 3 edit modal allowing editing of transaction types, "From account" and "To account", amounts, payees, categories, and exclusion toggles.
          - 🏷️ **Automatic "Internal Transfer" Category**: Transfer transactions automatically apply the dedicated "Internal Transfer" category and are marked as nullified from spend calculations.
          - 📋 **Integrated Transactions Screen**: 3-tab layout (Transactions, Analytics, Compare) with account breakdown cards, filter chips (All, Outflow, Inflow, Transfers), and clickable list items.
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
