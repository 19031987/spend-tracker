name: Build SpendTracker Android APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Accept Android SDK Licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Build Signed APK & Play Store App Bundle (AAB)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        gradle assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee build.log || (echo "### Build Failure" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && tail -n 80 build.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && exit 1)

    - name: List Generated Build Outputs
      run: find app/build/outputs -type f

    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-Release-APK
        path: app/build/outputs/**/*.apk
        if-no-files-found: warn

    - name: Upload Play Store App Bundle (AAB)
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-GooglePlay-AAB
        path: app/build/outputs/**/*.aab
        if-no-files-found: warn
