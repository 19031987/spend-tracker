name: Build SpendTracker Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true

    - name: Accept Android SDK Licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Unit Tests (Release)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        if ! ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace > test.log 2>&1; then
          echo "=== UNIT TESTS FAILED ==="
          grep -E "(e: |error:|FAILURE:|BUILD FAILED|FAILED)" test.log | head -n 30 | while read -r line; do
            echo "::error::$line"
          done
          exit 1
        fi

    - name: Prepare Release Signing Key
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        SECRET_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        SECRET_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        SECRET_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # Commit that still contains the original (already public) keystore and its passwords.
        LEGACY_KEY_COMMIT: f6ecb6058e327312deeed8c42f9fa01b2b7ff68d
      run: |
        KEYSTORE="$RUNNER_TEMP/release.jks"
        if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          STORE_PASSWORD="$SECRET_STORE_PASSWORD"
          KEY_ALIAS="$SECRET_KEY_ALIAS"
          KEY_PASSWORD="$SECRET_KEY_PASSWORD"
          echo "Release signing key loaded from secrets."
        else
          # No signing secrets: fall back to the original key, which is public in this repo's history,
          # so releases keep installing over existing copies. Replace it with a private key via the
          # RELEASE_* secrets (docs/release-setup.md).
          git fetch --quiet --depth=1 origin "$LEGACY_KEY_COMMIT"
          git show "$LEGACY_KEY_COMMIT:release-keystore.jks" > "$KEYSTORE"
          OLD_GRADLE=$(git show "$LEGACY_KEY_COMMIT:app/build.gradle.kts")
          STORE_PASSWORD=$(printf '%s\n' "$OLD_GRADLE" | sed -n 's/.*storePassword = "\(.*\)".*/\1/p' | head -n1)
          KEY_ALIAS=$(printf '%s\n' "$OLD_GRADLE" | sed -n 's/.*keyAlias = "\(.*\)".*/\1/p' | head -n1)
          KEY_PASSWORD=$(printf '%s\n' "$OLD_GRADLE" | sed -n 's/.*keyPassword = "\(.*\)".*/\1/p' | head -n1)
          echo "::warning::RELEASE_* secrets not set; signing with the original key from git history (it is public). See docs/release-setup.md"
        fi
        if [ ! -s "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
          echo "::error::Signing key or passwords are empty; refusing to publish an unsigned release. See docs/release-setup.md"
          exit 1
        fi
        echo "::add-mask::$STORE_PASSWORD"
        echo "::add-mask::$KEY_PASSWORD"
        {
          echo "RELEASE_STORE_FILE=$KEYSTORE"
          echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
        } >> "$GITHUB_ENV"

    - name: Build Signed APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        if ! ./gradlew :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1; then
          echo "=== GRADLE BUILD FAILED ==="
          grep -E "(e: |error:|FAILURE:|BUILD FAILED|Caused by:)" build.log | head -n 30 | while read -r line; do
            echo "::error::$line"
          done
          tail -n 15 build.log | while read -r line; do
            echo "::error::TAIL: $line"
          done
          exit 1
        fi
        mkdir -p dist
        find app/build/outputs/ -name "*.apk" -exec cp -v {} dist/ \;
        ls -la dist/

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-Release-Files
        path: dist/
        if-no-files-found: error

    - name: Read app version
      id: version
      run: |
        VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
        if [ -z "$VERSION" ]; then echo "::error::versionName not found in app/build.gradle.kts"; exit 1; fi
        echo "name=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Publish GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v${{ steps.version.outputs.name }}
        name: "SpendTracker Release v${{ steps.version.outputs.name }}"
        body: |
          ### SpendTracker v2.2.2 - Web-shop vendors
          - 🏷️ Alerts like "your-saving.com £45.50 with HSBC Premier Credit Card" now record **your-saving.com** as the vendor instead of Unknown Vendor.
          - 🔧 Existing transactions saved as Unknown Vendor from such alerts are fixed automatically when the app opens.

          ### SpendTracker v2.2.1 - Edit recurring payments from any tab
          - ✏️ Tap any payment in the **Upcoming** or **Calendar** tab of More → Recurring to edit or delete it (before, only the All tab opened the editor).

          ### SpendTracker v2.2.0 - Recurring payments you add yourself, account & category management, backups
          - 🔁 **Add recurring payments by hand** (More → Recurring → Add recurring): name, amount, how often, date, category, money in or out. Tap any tracked payment to edit it; ignored payments can be restored.
          - 🎯 **Archived goals** are now visible and can be unarchived.
          - 🏦 **Accounts** tab in Settings: add, rename and delete accounts. "Add transaction" remembers the account you last used.
          - 🏷️ **Categories**: edit name, emoji, colour and group, restore hidden categories, rename or delete groups; merchant rules can be edited (Contains / Starts with / Equals).
          - 💾 **Backup & restore**: save a full backup file (and CSV), then import it with Merge or Replace.
          - 🎨 **Consistent look**: one style for cards, headers, empty states and buttons on every screen and sheet; dark mode fixes.
          - 🐛 Amounts like "1,000" are now read as one thousand.

          ### SpendTracker v2.1.1 - Month-over-month comparison
          - 📈 **Compared with last month** card on Home: spending, income and savings this month-to-date against the same days of last month, plus the categories you're spending more and less on (green = better, red = worse).
          - 🏠 The month summary now says how much more or less you've spent than this time last month.
          - 🧭 Fixed bottom navigation labels wrapping and breaking alignment at larger font sizes.

          ### SpendTracker v2.1.0 - Budgets, Recurring, Goals & Cash Flow
          - 🏠 **Home dashboard**: this month's summary, budget left to spend, transactions to review, upcoming bills, top categories, goals and recent activity.
          - 🧭 **New navigation**: Home · Transactions · Cash flow · Budget · More.
          - 💷 **Budgets**: per-category monthly budgets grouped by category group, "left to spend" with a today-pace marker, optional rollover, and suggested budgets from your last 3 months.
          - 🔁 **Recurring**: detects regular bills and subscriptions from your history; approve or ignore suggestions; Upcoming, Calendar and All views with paid / different amount / upcoming / overdue status.
          - 🎯 **Goals**: savings goals with target amount and date, add or withdraw money, progress ring, monthly amount needed and projected finish date.
          - 📊 **Cash flow**: 6 or 12 month income vs spending chart, savings and savings rate, and breakdowns by category, group or merchant with drill-down.
          - ✅ **Review inbox**: transactions captured from notifications are flagged for review; swipe or tap to mark reviewed, with undo.
          - 🔎 **Search** transactions by merchant, category, note or amount, plus a "Needs review" filter.
          - 🐛 Fixed rules created from the edit sheet being silently ignored.

          ### SpendTracker v2.0.0 - Material 3 Redesign
          - 🎨 **New Material 3 theme**: custom indigo colour scheme with matching light & dark palettes, tuned type scale and rounded shape system; system bars follow the in-app theme choice.
          - 🧭 **Bottom navigation bar** (Activity / Insights / Compare) replaces the emoji segmented tabs; Material top app bar that tints on scroll; floating "Add" action button.
          - 💳 **Cleaner home screen**: tonal hero card with auto-fitting monthly spend, Money in / Money out tiles and carried-over balance; outlined account cards; filter chips with check marks; day-grouped transaction lists with rounded list groups.
          - 🌗 Money colours (income, surplus, overspend) now respect the app's own light/dark setting instead of the system setting.
          - Insights, Compare and lock screens restyled to the same card and shape system.

          ### SpendTracker v1.9.0 - Personal Finance Analytics, Real Compare Insights & Clean Architecture
          - 📊 **Real Interval Comparison (Compare Tab)**:
            - "By Time" mode now aggregates genuine Room transactions instead of placeholder data: 7 day buckets (Mon–Sun) for weekly, 4 week buckets (Days 1–7, 8–14, 15–21, 22–end) for monthly, and 12 calendar-month buckets for yearly comparisons.
            - Spending aggregation excludes non-spending rows (internal transfers and excluded transactions).
          - 💡 **Personal Finance Analytics (Analytics Tab)**:
            - New Micro-KPI strip: Daily Average run-rate, Projected period total, and Net Savings.
            - Income tracking with net savings and savings rate (%) for the selected period.
            - Automated Spending Insights: pacing vs previous period, top merchant concentration, and peak spend day.
          - 🏷️ **Custom Category Preservation**: Analytics category shares now display user-defined custom category names and emoji instead of collapsing to "Other".
          - 🧹 **Clean Architecture Refactor**:
            - Extracted shared utilities (`CurrencyUtils`, `DateUtils`, `ColorUtils`) and reusable UI components (`StatusBadge`, `CategoryBadge`, `TransactionRow`, `AccountSelector`, `MetricCard`).
            - Split bundled ViewModels into single-responsibility ViewModels (Transactions, AddTransaction, Comparison, Analytics, Settings).
            - Removed 558 lines of obsolete unreferenced `activity_main.xml`.
          - 🎨 **Cosmetic & Layout Fixes**: Hero card 2-tier layout preventing 'In' / 'Carried' collision, tab label truncation fix, canvas x-clamping, and scrollable settings tabs.
          - ✅ **Testing & CI**: Comprehensive JVM unit tests (72+) covering parsers, categorization, period math, chart bucketing, currency utils, interval comparisons, and analytics calculations; CI now runs release unit tests and uses the Gradle wrapper.
          - 🔄 All v1.8.8 fixes included (Monthly Reset, Carry Over Salary, Full-Width Amount UI, Premier/HSBC dedup, and more):
          - 💰 **Full-Width Spending Amount Display (Fixes `34...` Truncation)**:
            - Redesigned the Hero Cash Flow Card so the primary spending amount is given dedicated full width (`headlineLarge`, bold).
            - Repositioned the status pill (`Saved: +...` / `Deficit: -...`) into the top header row alongside the month label.
            - Eliminates horizontal squeeze and removes ellipsis truncation (`34...`), ensuring the full currency and amount are always clearly visible.
          - 🔄 **Monthly Spending Reset**:
            - Monthly spending (`monthSpent`) and income (`monthIncome`) now strictly aggregate transactions within the current calendar month.
            - Spending automatically resets to zero on the 1st of every month for a clean monthly spend tracking cycle.
          - 💼 **Carry Over Salary & Prior Savings**:
            - Net savings and salary credits from prior months (`timestamp < startOfMonth`) carry over into available funds (`carriedOverSalary`).
            - Total available net balance is calculated as `carriedOverSalary + monthIncome - monthSpent`, ensuring salary received in preceding months is preserved and not lost.
            - Added an informative `Carried: +£...` breakdown tag on the home page when prior carryover exists.
          - 🏦 **Synchronized Bank Accounts**:
            - Bank source breakdown cards now track current month spending while preserving carried-over account balances.
          - 🖥️ **Updated Simulator**:
            - Synchronized `generate_simulator.py` and `simulator/index.html` with identical monthly reset and salary carryover metrics.
          - 🏦 **Premier & HSBC Duplicate Transaction Resolution**:
            - When a transaction with the same amount and same vendor (or an unknown vendor transaction with the same amount within the deduplication window) is reported across `Premier` and `HSBC`, it is detected as a duplicate and saved under `HSBC`.
            - Unknown vendor transactions with different amounts or different times are never treated as duplicates.
            - Retroactively consolidates and deduplicates existing `Premier` and `HSBC` records in Room and SQLite on startup.
          - 🚫 **Removed Between-Account (`🔄 Between Accounts` / `TRANSFER`) Feature**:
            - Removed `🔄 Between Accounts` (`TRANSFER`) toggle, `To account` selector, and `Internal Transfer` banners from Add & Edit Transaction sheets.
            - Removed `🔄 Transfers` filter chip and transfer counters/badges from the Transactions dashboard and Hero Cash Flow card.
            - Removed dual-leg internal transfer insertion from `SpendNotificationListenerService` and auto-cleaned legacy `TRANSFER` / `INTERNAL_TRANSFER` rows on startup.
          - 📐 **Strict Record Alignment Across Unknown Vendor, Known Vendor, and Money In (`IN`) Rows**:
            - Enforced a uniform 2-row fixed-height (`22dp` + `6dp` + `22dp`) grid inside `TransactionRowItem` for both the middle details column and right amount/time column.
            - Prevented `Unknown Vendor` + `✏️ Set` badge from wrapping onto two lines on narrow screens.
            - Replaced multi-line `FlowRow` on the secondary metadata line with a single-line `22dp` `Row` so `INCOME` categories (`💰 Other income`) and long category/bank pills never wrap or jitter vertically.
            - Standardized category icon boxes (`32dp`), date filter buttons (`38dp`), bank account summary cards, and comparison/settings rows to prevent layout shifts.
          - 🔄 **Retroactive Past Transaction Auto-Repair**:
            - On app startup, automatically scans previously saved transactions in Room and legacy SQLite databases.
            - Re-parses any past notifications containing structured pipe alerts (e.g. `£50.00 transaction | TRIPURA JHANSI RANCHASE | HSBC ADVANCE`).
            - Automatically resolves and replaces generic "Money In" or "Unknown Vendor" labels with the true sender/merchant name ("Tripura Jhansi Ranchase").
            - Corrects inverted expense signs to positive Income (+£50.00).
          - 📨 **Full Support for HSBC & Bank Pipe Notifications (`Money In` & `Money Out`)**:
            - Accurately captures both `Money In` (income/deposits) and `Money Out` (spending/expenses) from notification titles and content.
            - Handles formats such as `£50.00 transaction | TRIPURA JHANSI RANCHASE | HSBC ADVANCE` and `£15.50 transaction | Costa Coffee | HSBC ADVANCE`.
            - Appropriately attributes Money Out to spending categories (e.g. Dining, Groceries, Shopping) and Money In to Income / Transfers In.
            - Cleans all-caps vendor/sender names into polished Title Case.
          - 📨 **Structured Pipe-Format Parsing (`amount | sender name | Bank`)**:
            - Automatically parses structured alerts (e.g. `£50.00 | John Smith | HSBC` or `£1,250.50 | TechCorp Payroll | Chase`).
            - Captures sender name as merchant and routes to the designated bank account with zero manual tagging.
            - Defaults to Money In (`TYPE_IN`) for incoming transfers and payroll.
            - Bypasses SMS financial transaction verb constraints for structured alerts while preserving strict anti-spam filters.
            - Isolates `IGNORE` filters from legitimate sender names (e.g. "Win Tan" is preserved).
          - 🛡️ **Sender-Aware Notification Deduplication**:
            - Two transactions of the same amount arriving within 60s at the same bank from different senders are recorded as separate transactions instead of erroneously deduplicating.
            - Seamlessly merges companion SMS and app alerts to enrich blank or generic merchant rows.
          - 💰 **Amount Remaining / Saved (Net Difference)**:
            - Dynamically computes the net difference between Money In (income) and Money Out (expenses) with internal transfers nullified.
            - Prominent **"Saved / Left"** (positive surplus) vs **"Deficit"** (negative overspend) badge in the hero cash flow card.
            - Added individual net remaining indicators (`Rem: +£...` / `Rem: -£...`) to each bank account source card in the horizontal carousel.
          - 🏦 **Bank Source Cleanup & Auto-Discovery**:
            - Eliminated unnecessary "Messages" and "Savings" source accounts.
            - Real-time auto-discovery: genuine bank sources (Barclays, Monzo, Starling, Revolut, Lloyds, etc.) are automatically added when new transactions arrive.
            - SMS notification parser attributes card spend to genuine bank accounts rather than messaging app packages.
            - Database migration automatically re-links orphan/junk accounts to canonical bank accounts.
          - 📅 **Custom Date Picker in Record Transaction**:
            - Added calendar date picker dialog (`Pick Date`) alongside Today, Yesterday, and 2 Days Ago.
            - Easily add Money In / Out or Transfers on any given past or future date.
          - 📐 **Landing Page Net Spending Hero Card Alignment**:
            - Refactored Spent, Income, and Transfers indicators to prevent awkward multi-line word wrapping and vertical squishing on narrow devices.
          - 📊 **Category-Level Period Comparison in Compare Tab**:
            - Compares actual spending across individual categories between current and previous periods.
          - 📊 **Category-Level Period Comparison in Compare Tab**:
            - Compares actual spending across individual categories (Groceries, Dining Out, Utilities, Transport, etc.) between the current period and previous period (Week, Month, Year).
            - Real-time reactive data pipeline powered by Room database transactions and category catalogue.
            - Visual progress indicator bars showing proportional category spend with percentage and delta badges.
            - Interactive Mode Selector: Switch effortlessly between **By Category** (Category Comparison) and **By Time** (Interval Breakdown).
          - 🌊 **Monarch-Style Cash Flow Sankey & Breakdown Treemap**:
            - 4-column node alignment (`Account` ➔ `Group` ➔ `Category` ➔ `Merchant`).
            - Interactive depth toggle and dynamic fixed living costs exclusion toggle.
          - 🗺️ **Hierarchical Spending Breakdown Treemap**:
            - Proportional spending nested by `Group` ➔ `Category` ➔ `Merchant` with zoomable drill-down.
          - ⚖️ **Dynamic Fixed Living Costs Exclusion Toggle**:
            - Prominent toggle to exclude Rent & Utilities, dynamically rescaling nodes, link flows, and proportions between all-in spend (£1,540.77) and day-to-day spend (£242.98).
          - 📊 **Reactive KPI Ribbon**:
            - Real-time updates for Total Spend, Transaction Count, Top Spending Group, and Top Merchant with visit counts.
          - 📱 **All-in-One Dashboard & Simulator Integration**:
            - Direct simulator access and standalone cash flow breakdown page.
          - 🔒 **Fingerprint & Biometric Authentication Access** (v1.6.0 features included).
          - 🍕 **Promotional & Advertisement Notification Filtering**:
            - Protection against promotional deals, retail offers, and marketing notifications (e.g. Domino's "Save £10 when you spend £30", pizza deals, voucher codes, discounts).
            - Enforced strict financial transaction verification for SMS alerts (`debited`, `spent`, `paid at`, `card ending`, etc.).
          - 🏦 **Eliminated Legacy "Checking" Account**:
            - Legacy seeded "Checking" / "current account" sources are cleanly remapped and consolidated into the canonical Chase bank account.
            - Added Room Migration 6 -> 7 and automated database startup cleanup that safely migrates any existing transactions referencing "Checking" to Chase, and permanently purges "Checking" from accounts, pickers, and filter chips.
          - ⏰ **UI Time & Timestamp Alignment**:
            - Aligned transaction timestamp (`HH:mm`) in the dedicated right-hand column directly beneath the amount.
            - Enhanced metadata badges with adaptive wrapping (`FlowRow`).
          - ⏱️ **Notification Deduplication & Directional Parsing**:
            - Time-window fingerprinting (±60s) and smart incoming/outgoing parsing.
            - Implemented automated database migration and `onOpen` consolidation that safely remaps existing transactions referencing duplicate account rows to the canonical account ID before removing duplicates.
            - Normalized bank names across notifications and UI (handling case differences, aliases like "Chase UK", "Barclaycard", and trailing terms like "Bank" / "Account").
            - Deduplicated account lists across filter chips, transaction editors, and transfer pickers.
          - ⏱️ **Time-Window Fingerprinting (Deduplication)**:
            - Deduplication window (±60s) matching amount and bank source with in-place record enrichment.
          - ↕️ **Strict Directional Parsing**:
            - Semantic Money In / Money Out classification with internal transfer nullification between own accounts.
          - 📊 **Baseline Guard for First Load Comparisons**:
            - Replaces premature delta percentages with onboarding guidance until baseline data is collected.
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
