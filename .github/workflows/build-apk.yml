name: Build SpendTracker Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: |
        if [ -f gradlew ]; then chmod +x gradlew; fi

    - name: Build Signed APK and Play Store App Bundle (AAB)
      run: |
        gradle assembleRelease bundleRelease --no-daemon || ./gradlew assembleRelease bundleRelease

    - name: Upload Release APK (Direct Install)
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-Release-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Upload Google Play Bundle (AAB)
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-GooglePlay-AAB
        path: app/build/outputs/bundle/release/*.aab
