name: Build SpendTracker Android APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Signed APK & Play Store App Bundle (AAB)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        gradle assembleRelease bundleRelease --no-daemon --stacktrace

    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    - name: Upload Play Store App Bundle (AAB)
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-GooglePlay-AAB
        path: app/build/outputs/bundle/release/*.aab
        if-no-files-found: error
