name: Build SpendTracker Android APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Accept Android SDK Licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Build Signed APK & Play Store App Bundle (AAB)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        set -o pipefail
        gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
        mkdir -p dist
        find app/build/outputs/ -name "*.apk" -exec cp -v {} dist/ \;
        find app/build/outputs/ -name "*.aab" -exec cp -v {} dist/ \;
        ls -la dist/

    - name: Upload Signed Release Files (APK and AAB)
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-Release-Files
        path: dist/
        if-no-files-found: error

    - name: Publish GitHub Release with APK & AAB
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.2.0
        name: "SpendTracker Release v1.2.0 (Smart Auto-Categorization & Period Comparison)"
        body: |
          ### SpendTracker v1.2.0 - Monarch Money Features & Period Comparison
          - ⚡ **3-Tier Smart Auto-Categorization**: Automatic payee evaluation (User Custom Rules ➔ Historical Memory ➔ Built-in Dictionary) with live auto-assigned badges.
          - ⚙️ **Monarch-Style Settings Modal**: 4 dedicated tabs for Categories & Groups, Merchant Rules, App Preferences (currencies, timeframes, theme), and Data Actions (CSV/JSON export, demo reset).
          - ➕ **Custom Category & Group Creator**: Create subcategories and groups with custom emojis, pastel color swatches, and automatic merchant rule persistence.
          - 🔔 **Room-Powered Notification Listener**: Intercepts bank spend alerts directly into Room database with in-app permission banner.
          - 📈 **Period Comparison Screen (M3)**: Week, Month, and Year comparison view with `SingleChoiceSegmentedButtonRow`, elevated overview card, trend badges, and dual-track progress breakdown.
          - 🧪 **Interactive Simulator & Verification Studio**: Browser harness with push simulator, bank presets, and automated test suite.
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
