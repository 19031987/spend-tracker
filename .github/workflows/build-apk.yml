name: Build SpendTracker Android APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Accept Android SDK Licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Build Signed APK & Play Store App Bundle (AAB)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        set -o pipefail
        gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
        mkdir -p dist
        find app/build/outputs/ -name "*.apk" -exec cp -v {} dist/ \;
        find app/build/outputs/ -name "*.aab" -exec cp -v {} dist/ \;
        ls -la dist/

    - name: Upload Signed Release Files (APK and AAB)
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-Release-Files
        path: dist/
        if-no-files-found: error

    - name: Publish GitHub Release with APK & AAB
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.5.0
        name: "SpendTracker Release v1.5.0 (Deduplication, Directional Parsing, Baseline Guard, Dynamic Banks)"
        body: |
          ### SpendTracker v1.5.0 - Key Fixes & Enhancements
          - ⏱️ **Time-Window Fingerprinting (Deduplication)**: Deduplication window (±60 seconds) matching amount and bank source. Subsequent rapid notifications enrich the existing record with vendor/type details rather than duplicating rows.
          - ↕️ **Strict Directional Parsing**: Money In ("received", "refund", "cashback", "paid you", "deposit") is recorded under income; Money Out ("paid", "spent", "purchase", "card payment") is recorded under spend; internal transfers between own accounts are safely nullified.
          - 📊 **Baseline Guard for First Load Comparisons**: Replaces misleading percentage deltas (+100% on fresh installs) with an onboarding state ("Building your baseline: comparisons will appear after your first week/month").
          - 🏦 **Dynamic Bank Discovery**: Automatically extracts bank app identifiers and dynamically registers new banks in the accounts list, making them immediately available in filters and editors.
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
