name: Build SpendTracker Android APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Accept Android SDK Licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Build Signed APK & Play Store App Bundle (AAB)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        set -o pipefail
        gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
        mkdir -p dist
        find app/build/outputs/ -name "*.apk" -exec cp -v {} dist/ \;
        find app/build/outputs/ -name "*.aab" -exec cp -v {} dist/ \;
        ls -la dist/

    - name: Upload Signed Release Files (APK and AAB)
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-Release-Files
        path: dist/
        if-no-files-found: error

    - name: Publish GitHub Release with APK & AAB
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.1.0
        name: "SpendTracker Release v1.1.0 (Jetpack Compose & Room Edition)"
        body: |
          ### SpendTracker v1.1.0 - Jetpack Compose & Room Edition
          - 🎨 **Jetpack Compose & Material 3**: Complete UI modernized with Compose, dynamic safe-area insets, and overlap-proof header bar.
          - 🔄 **Internal Account Transfers**: Dual-legged atomic transfer entries (`-amount` source, `+amount` destination) with spend exclusion flag ensuring internal money movements never distort analytics.
          - 📊 **Spending Analytics & Canvas Bar Charts**: Compare Week, Month, or Year spend against previous periods with +/- delta badge and category progress breakdown.
          - 🏷️ **Dynamic Categorization & Transfer Mode**: Dynamic filter chips for Expenses/Income and contextual transfer note fields.
          - 🗄️ **Room v2 Migration**: Upgraded database with migration path, auto-linked transfers, and reactive Flows.
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
