name: Build SpendTracker Android APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Accept Android SDK Licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Build Signed APK & Play Store App Bundle (AAB)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        set -o pipefail
        gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
        mkdir -p dist
        find app/build/outputs/ -name "*.apk" -exec cp -v {} dist/ \;
        find app/build/outputs/ -name "*.aab" -exec cp -v {} dist/ \;
        ls -la dist/

    - name: Upload Signed Release Files (APK and AAB)
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-Release-Files
        path: dist/
        if-no-files-found: error

    - name: Publish GitHub Release with APK & AAB
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.4.0
        name: "SpendTracker Release v1.4.0 (Vendor Identification, Day Grouping, Category Picker Dialog & Transfer Clarifications)"
        body: |
          ### SpendTracker v1.4.0 - Key Fixes & Enhancements
          - 🏢 **Vendor Identification (Issue 1)**: Enhanced parser with `paid <Vendor>` and leading retailer patterns; eliminates generic "Chase Payment" fallbacks. Transactions with missing vendors display a prominent `Unknown Vendor` badge with `✏️ Tap to set`.
          - 📅 **Day Grouping & Totals (Issue 2)**: Transactions are clearly grouped by day (e.g. `Today · 9 Oct`, `Yesterday · 8 Oct`, `Monday, 6 Oct`) with daily spend totals. Prominent amount display (`−£14.80`, `+£2,850.00`, `£250.00`) and transaction timestamps (`14:20`).
          - 🏷️ **Reliable Category Selection (Issue 3)**: Fixed category selection by replacing nested bottom sheets with `CategoryPickerDialog` in Compose Dialog. Tapping the category pill directly on any transaction allows instant re-categorization.
          - 🔄 **Option A Transfer Rules (Issue 4)**: Internal transfers between user's own accounts (Chase ↔ HSBC) are strictly nullified and excluded from spend calculations. Payments/transfers to third parties (landlord, friends) count as spending.
          - ↕️ **3-Way Direction & Day Picker in Add Sheet (Issue 5)**: Clear 3-way toggle (`↓ Money Out`, `↑ Money In`, `🔄 Between Accounts`), color-coded amounts (`−£`, `+£`), and day selectors (`Today`, `Yesterday`, `2 Days Ago`).
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
