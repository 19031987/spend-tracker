name: Build SpendTracker Android APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-disabled: true

    - name: Accept Android SDK Licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Build Signed APK & Play Store App Bundle (AAB)
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        set -o pipefail
        gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
        mkdir -p dist
        find app/build/outputs/ -name "*.apk" -exec cp -v {} dist/ \;
        find app/build/outputs/ -name "*.aab" -exec cp -v {} dist/ \;
        ls -la dist/

    - name: Upload Signed Release Files (APK and AAB)
      uses: actions/upload-artifact@v4
      with:
        name: SpendTracker-Release-Files
        path: dist/
        if-no-files-found: error

    - name: Publish GitHub Release with APK & AAB
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.4
        name: "SpendTracker Release v1.0.4 (Material UI White & Black Edition)"
        body: |
          ### SpendTracker v1.0.4 - Material UI White & Black Edition
          - ⚪⚫ **Material UI White & Black Theme**: High-contrast monochrome Material Design with pure white surface, pitch black accents, and subtle borders.
          - 💰 **Fixed Calculation & Sign Inversion**: Deposits (e.g. +£23.00) are accurately logged as positive inflow; expenses (-£4.00) without phantom balance additions.
          - 🔍 **Strict Word-Boundary Source Matching**: Eliminates misclassification of "purchase" as "Chase".
          - 🛡️ **SQLite Hash Deduplication**: Prevents repeated notifications from double-counting within a 3-minute window.
          - 📦 **Self-Healing Database**: Repaired existing corrupt rows on launch and maintains cash flow accuracy.
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
